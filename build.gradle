plugins {
    id 'signing'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
    id 'com.palantir.git-version' version '5.1.0'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
}
description = "A tool for generating Java based Wiremock stubs from Spring MVC controllers"
group = 'io.github.lsd-consulting'
version = gitVersion().replaceAll("^v", "") ?: "SNAPSHOT"
logger.lifecycle("Build Version = ${version}")

// Never release a build of a modified working tree: git-version marks it ".dirty".
// Publishing to Maven Local is still allowed.
gradle.taskGraph.whenReady { graph ->
    def publishing = graph.allTasks.any { it.name.contains('Sonatype') || it.name.endsWith('StagingRepositories') }
    if (publishing && version.toString().contains('dirty')) {
        throw new GradleException("Refusing to publish ${version}: the working tree has uncommitted changes. Run `git status` in CI to see which files.")
    }
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

subprojects {
    group = rootProject.getGroup()
    version = rootProject.getVersion()
}

allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
    }
}

apply from: 'hooks.gradle'

nexusPublishing {
    repositories {
        // OSSRH (s01.oss.sonatype.org) returns HTTP 402; use Central Portal staging API
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
        }
    }
}
